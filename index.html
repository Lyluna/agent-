<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="description" content="跨 agent 共享记忆库 · 客户端解密的加密门户">
<title>记忆库 · 脉络 · 个人工作台</title>
<meta name="theme-color" content="#f6f7f5">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#mainContent">跳到主要内容</a>

<!-- ============================================================
     锁屏
     ============================================================ -->
<div id="lock">
  <div class="gate-backdrop" aria-hidden="true">
    <svg class="gate-lattice" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid slice">
      <g class="gate-lattice-lines" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M126 118 L268 54 L420 108 L548 62 L704 136"/>
        <path d="M126 118 L180 262 L96 404 L214 548 L140 686"/>
        <path d="M268 54 L298 214 L420 108 L452 276 L548 62"/>
        <path d="M704 136 L642 288 L792 352 L704 508 L812 626"/>
        <path d="M298 214 L180 262 L214 548 L360 470 L452 276"/>
        <path d="M642 288 L548 340 L360 470 L452 276"/>
        <path d="M548 340 L604 486 L704 508 L604 640 L512 700"/>
        <path d="M214 548 L320 612 L360 470 L512 700 L604 640"/>
        <path d="M96 404 L214 548 L180 262"/>
        <path d="M792 352 L704 508 L812 626"/>
      </g>
      <g class="gate-lattice-nodes" fill="currentColor">
        <circle cx="126" cy="118" r="3"/>
        <circle cx="268" cy="54" r="3"/>
        <circle cx="420" cy="108" r="4"/>
        <circle cx="548" cy="62" r="3"/>
        <circle cx="704" cy="136" r="3"/>
        <circle cx="180" cy="262" r="3"/>
        <circle cx="298" cy="214" r="3"/>
        <circle cx="452" cy="276" r="4"/>
        <circle cx="642" cy="288" r="3"/>
        <circle cx="96" cy="404" r="3"/>
        <circle cx="360" cy="470" r="4"/>
        <circle cx="548" cy="340" r="3"/>
        <circle cx="792" cy="352" r="3"/>
        <circle cx="214" cy="548" r="3"/>
        <circle cx="604" cy="486" r="3"/>
        <circle cx="704" cy="508" r="4"/>
        <circle cx="320" cy="612" r="3"/>
        <circle cx="512" cy="700" r="3"/>
        <circle cx="604" cy="640" r="3"/>
        <circle cx="140" cy="686" r="3"/>
        <circle cx="812" cy="626" r="3"/>
      </g>
      <g class="gate-lattice-signal" fill="currentColor">
        <circle cx="420" cy="108" r="9"/>
        <circle cx="452" cy="276" r="9"/>
        <circle cx="360" cy="470" r="9"/>
        <circle cx="704" cy="508" r="9"/>
      </g>
    </svg>
    <div class="gate-vignette"></div>
  </div>

  <div class="gate">
    <section class="gate-intro">
      <div class="gate-brand">
        <svg class="gate-seal" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="10.5" width="17" height="10.5" rx="2"/>
          <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
          <circle cx="12" cy="15.75" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="gate-word">脉络</span>
        <span class="gate-sub">共享记忆库</span>
      </div>

      <h1>记忆在本地，<br>钥匙在你手里。</h1>
      <p class="gate-lede">各 Agent 的对话、结论与待办，以密文留在这里。密码不发送、不记录，只在这台浏览器里使用。</p>

      <dl class="gate-facts">
        <div><dt>加密</dt><dd>AES-256-GCM</dd></div>
        <div><dt>解密</dt><dd>仅浏览器内</dd></div>
        <div><dt>服务端</dt><dd>零明文</dd></div>
      </dl>
    </section>

    <section class="gate-panel" aria-labelledby="gatePanelTitle">
      <div class="gate-panel-head">
        <h2 id="gatePanelTitle">解锁记忆库</h2>
        <span class="gate-state"><span class="gate-dot"></span>本地解密</span>
      </div>
      <p class="gate-hint" id="lockHint">输入访问密码继续。密码不会离开这台设备。</p>

      <form class="lock-form" id="lockForm" novalidate>
        <label class="field-label" for="passwordInput">访问密码</label>
        <div class="field-wrap">
          <input class="field" id="passwordInput" type="password" placeholder="输入访问密码"
                 autocomplete="current-password" spellcheck="false"
                 aria-describedby="lockHint lockErr">
          <button class="field-reveal" id="revealBtn" type="button"
                  aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/>
              <circle cx="12" cy="12" r="2.5"/>
            </svg>
          </button>
        </div>
        <p class="caps-hint" id="capsHint" hidden>大写锁定已开启</p>

        <button class="btn gate-submit" id="unlockBtn" type="submit" aria-busy="false">
          <span id="unlockLabel">解密进入</span>
          <svg class="gate-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 12h14M13 6.5l5.5 5.5-5.5 5.5"/>
          </svg>
        </button>
        <div class="lock-err" id="lockErr" role="alert" aria-live="polite"></div>
      </form>

      <p class="gate-foot">
        <span>encrypted.bin</span>
        <span>客户端解密</span>
        <span>无遥测</span>
      </p>
    </section>
  </div>

  <footer class="gate-meta">
    <span>脉络 / 共享记忆库</span>
    <span class="gate-meta-right">本地优先 · 端到端加密内容</span>
  </footer>
</div>

<!-- ============================================================
     主界面
     ============================================================ -->
<div id="app">

  <aside class="rail">
    <div class="rail-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="10.5" width="17" height="10.5" rx="2"/>
        <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/>
      </svg>
      <span class="brand-word">脉络<span class="brand-sub">记忆库 · 个人工作台</span></span>
      <button class="rail-collapse" id="railToggle" aria-expanded="true"
              aria-controls="railNav" aria-label="收起侧边栏" title="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 6.5L9 12l5.5 5.5"/>
        </svg>
      </button>
    </div>

    <nav class="rail-nav" id="railNav" aria-label="分区"></nav>

    <div class="rail-foot">
      <div class="kbd-hint">
        <kbd>⌘</kbd><kbd>K</kbd>
        <span>搜索全部</span>
      </div>
      <button class="theme-toggle" id="cloudBtn" aria-label="云端写入设置" title="云端写入设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6.5 18a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 17.6 9.6 3.7 3.7 0 0 1 17.5 18z"/>
        </svg>
        <span id="cloudLabel">云端</span>
      </button>
      <button class="theme-toggle" id="themeBtn" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
        </svg>
        <span id="themeLabel">浅色</span>
      </button>
    </div>
  </aside>

  <main class="canvas" id="mainContent" tabindex="-1">
    <header class="page-head">
      <h1 id="pageTitle">概览</h1>
      <p class="finding" id="pageFinding"></p>
      <div class="meta" id="pageMeta"></div>
    </header>

    <nav class="tabs" id="viewTabs" role="tablist" aria-label="分区内视图" hidden></nav>

    <div class="toolbar">
      <button class="search-btn" id="searchBtn" aria-label="打开搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="M16 16l4.5 4.5"/>
        </svg>
        <span id="searchLabel">搜索事实、认知、待办</span>
        <span class="k kbd-hint"><kbd>⌘</kbd><kbd>K</kbd></span>
      </button>
      <div class="chip-row" id="toolFilter"></div>
    </div>

    <section class="view" id="view-overview"></section>
    <section class="view" id="view-work"></section>
    <section class="view" id="view-facts"></section>
    <section class="view" id="view-beliefs"></section>
    <section class="view" id="view-intents"></section>
    <section class="view" id="view-knowledge"></section>
    <section class="view" id="view-requests"></section>
    <section class="view" id="view-decide"></section>
    <section class="view" id="view-health"></section>
    <section class="view" id="view-evidence"></section>
    <section class="view" id="view-assets"></section>
    <section class="view" id="view-usage"></section>
    <section class="view" id="view-cloud"></section>
    <section class="view" id="view-disk"></section>
    <section class="view" id="view-agents"></section>
    <section class="view" id="view-graph">
      <div class="graph-toolbar"><div class="graph-filters" id="graphFilters" aria-label="关系类型"></div><button class="ghost-btn" id="motionBtn" aria-pressed="false">静态模式</button></div>
      <p class="sec-note">关系来自笔记里的显式双链和明确关联。没有依据的内容不会被自动连线。</p>
      <div class="graph-explorer"><div class="graph-map" id="graphCanvas"></div><div class="graph-list" id="graphList"></div><aside class="graph-detail" id="graphDetail"></aside></div>
      <p class="graph-limit" id="graphLimit"></p>
    </section>
  </main>
</div>

<!-- ============================================================
     命令面板
     ============================================================ -->
<div id="palette" role="dialog" aria-modal="true" aria-label="搜索">
  <div class="palette-box">
    <input class="palette-input" id="paletteInput" type="text"
           placeholder="搜索事实、认知、待办、技能、工具、知识…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="paletteList" role="listbox"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> 选择</span>
      <span><kbd>↵</kbd> 打开</span>
      <span><kbd>esc</kbd> 关闭</span>
    </div>
  </div>
</div>

<!-- 项目详情抽屉：点项目卡打开，展示 5W / 进度 / 验收 -->
<div id="projectDrawer" class="drawer" hidden>
  <div class="drawer-backdrop" data-drawer-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <button class="drawer-close" data-drawer-close aria-label="关闭">×</button>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<script src="crypto.js"></script>
<script src="graph-data.js"></script>
<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
