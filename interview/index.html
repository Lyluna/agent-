<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>面试提词器</title>
<style>
  :root{--bg:#0e1117;--card:#161c26;--line:rgba(255,255,255,.08);--fg:#e8ecf3;--dim:#8b95a7;
        --accent:#4c8dff;--ok:#2ecc8f;--warn:#f5b942;--danger:#ef5b5b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;max-width:100vw;overscroll-behavior:none}
  body{background:var(--bg);color:var(--fg);font:15px/1.6 "HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
         background:#11161e;border-bottom:1px solid var(--line);flex:none}
  .dot{width:9px;height:9px;border-radius:50%;background:#4e5769;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .t{font-weight:600;font-size:15px}.sp{flex:1}
  .mic{width:46px;height:46px;border-radius:50%;border:0;background:#1d2634;color:#9fb4d4;font-size:20px;
       display:flex;align-items:center;justify-content:center;flex:none}
  .mic.live{background:var(--ok);color:#06110c;box-shadow:0 0 0 6px rgba(46,204,143,.15)}
  .bar{padding:8px 12px;flex:none}
  input{width:100%;background:#0b0f15;border:1px solid var(--line);color:var(--fg);border-radius:10px;
        padding:11px 14px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 20px;-webkit-overflow-scrolling:touch}
  .sec{font-size:12px;color:var(--accent);letter-spacing:.5px;margin:10px 0 6px}
  .q{font-size:20px;font-weight:700;line-height:1.45;margin:0 0 8px;word-break:break-word}
  .q .ct{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:4px}
  .ans{background:linear-gradient(180deg,rgba(76,141,255,.16),rgba(76,141,255,.06));
       border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:16px;
       color:#dce7fb;margin-bottom:14px;word-break:break-word}
  .ans b{color:#fff}
  .h5{font-size:12px;color:#7c8698;margin:14px 0 6px;letter-spacing:.4px}
  ol{list-style:none;margin:0;padding:0}
  ol li{position:relative;padding:10px 12px 10px 34px;background:var(--card);border:1px solid var(--line);
        border-radius:10px;margin-bottom:8px;font-size:15px;word-break:break-word}
  ol li .n{position:absolute;left:11px;top:11px;width:17px;height:17px;border-radius:50%;
           background:rgba(76,141,255,.18);color:#8fb8ff;font-size:11px;font-weight:700;
           display:flex;align-items:center;justify-content:center}
  .bonus{background:rgba(46,204,143,.1);border-left:3px solid var(--ok);border-radius:8px;
         padding:10px 12px;font-size:14px;color:#b9ecd7;margin-top:10px}
  .follow div{font-size:14px;color:#d8c48f;background:rgba(245,185,66,.08);border-radius:8px;
              padding:9px 11px;margin-bottom:6px}
  .empty{text-align:center;color:#66707f;margin-top:80px;line-height:2}
  .empty b{color:#9fb4d4;display:block;font-size:17px;margin-bottom:8px}
  footer{flex:none;background:#0b0f15;border-top:1px solid var(--line);
         padding:6px 12px calc(6px + env(safe-area-inset-bottom));font-size:12px;color:#7b8598;max-height:78px;overflow:hidden}
  footer .lbl{font-size:10px;color:#4e5769;margin-bottom:2px}
  footer .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
  footer .l.now{color:#c9d6ea}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
  .drawer.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#141a24;border-radius:16px 16px 0 0;
         padding:14px 14px calc(20px + env(safe-area-inset-bottom));max-height:76vh;overflow:auto}
  .sheet h3{margin:0 0 10px;font-size:14px;color:#8b95a7;font-weight:500}
  .cat{padding:13px 12px;border-radius:10px;background:#1a2130;margin-bottom:8px;font-size:15px;
       display:flex;justify-content:space-between;align-items:center}
  .cat.on{background:rgba(76,141,255,.18);color:#a9c8ff}
  .cat .c{font-size:12px;color:#66707f}
  /* 解锁 */
  #lock{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;padding:24px;z-index:50}
  #lock h1{font-size:19px;margin:0;font-weight:600}
  #lock p{color:var(--dim);font-size:13px;margin:0;text-align:center;line-height:1.7}
  #lock input{max-width:280px;text-align:center;letter-spacing:2px}
  #lock button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 30px;font-size:15px}
  #lock .err{color:var(--danger);font-size:13px;height:18px}
</style>
</head>
<body>

<div id="lock">
  <h1>面试提词器</h1>
  <p>输入密码解锁题库<br><span style="font-size:12px">（本机解密，密码不上传）</span></p>
  <input id="pw" type="password" inputmode="text" placeholder="密码" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="unlock">解锁</button>
</div>

<header style="display:none" id="hd">
  <span class="dot" id="dot"></span>
  <span class="t">面试提词器</span><span class="sp"></span>
  <button class="mic" id="mic">🎤</button>
  <button class="mic" id="menu">☰</button>
</header>
<div class="bar" style="display:none" id="bar"><input id="q" placeholder="搜题，或直接说话"></div>
<main id="main" style="display:none"><div class="empty"><b>已解锁</b>点右上角 🎤 说话，或打字搜题</div></main>
<footer id="foot" style="display:none"><div class="lbl">听到</div><div class="l">—</div></footer>
<div class="drawer" id="drawer"><div class="sheet" id="sheet"><h3>按分类看（共 <span id="cnt"></span> 题）</h3><div id="cats"></div></div></div>

const norm = s => (s || '').toLowerCase().replace(/[\s\W_]+/g, '');
const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 解密 ---------- */
async function decrypt(password){
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

$('unlock').onclick = tryUnlock;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
async function tryUnlock(){
  const pw = $('pw').value.trim();
  if (!pw){ $('err').textContent = '请输入密码'; return; }
  $('unlock').textContent = '解锁中…';
  try{
    const d = await decrypt(pw);
    S.items = d.items; S.pats = d.pats; S.secs = d.secs;
    localStorage.setItem('ip_pw', pw);
    startApp();
    $('lock').style.display = 'none';
  }catch(e){
    $('unlock').textContent = '解锁';
    $('err').textContent = '密码不对，或文件损坏';
  }
}

function startApp(){
  ['hd','bar','main','foot'].forEach(id => $(id).style.display = '');
  if (S.items.length) render(S.items[0]);
}

/* ---------- 匹配 ---------- */
function score(t, it){
  const n = norm(t); if (!n) return 0;
  let s = 0;
  for (const k of it.k){ const nk = norm(k); if (nk && n.includes(nk)) s += 2 + Math.min(nk.length, 6) * 2; }
  return s;
}
function ngrams(s, n = 2){
  const t = norm(s); if (t.length < n) return new Set(t ? [t] : []);
  const out = new Set(); for (let i = 0; i <= t.length - n; i++) out.add(t.slice(i, i + n)); return out;
}
function fuzzy(t){
  const A = ngrams(t); if (!A.size) return [];
  const res = [];
  for (const it of S.items){
    const B = ngrams(it.q + ' ' + (it.qc || '')); if (!B.size) continue;
    let inter = 0; for (const x of A) if (B.has(x)) inter++;
    const j = inter / (A.size + B.size - inter);
    if (j >= 0.25) res.push([j, it]);
  }
  res.sort((a, b) => b[0] - a[0]); return res.slice(0, 3);
}
function classify(t){
  const n = norm(t); if (!n) return S.pats[S.pats.length - 1];
  let best = null, bn = 0;
  for (const p of S.pats){
    if (!p.triggers || !p.triggers.length) continue;
    let c = 0; for (const k of p.triggers){ const nk = norm(k); if (nk && n.includes(nk)) c++; }
    if (c > bn){ bn = c; best = p; }
  }
  return best || S.pats[S.pats.length - 1];
}
function looksQuestion(t){
  const qs = ['吗','呢','咩','什么','怎么','怎样','为什么','如何','哪','几时','是否','点解','点样','点做','点睇','边个','边度','?','？'];
  if (qs.some(q => t.includes(q))) return true;
  const verbs = ['介绍','说说','说一下','讲讲','谈谈','聊聊','举例','描述','评价','解释'];
  return verbs.some(v => t.includes(v)) || /^(请|麻烦|可以|能不能)/.test(t.trim());
}
function route(text){
  const hits = S.items.map(it => [score(text, it), it]).filter(x => x[0] >= 4).sort((a, b) => b[0] - a[0]);
  if (hits.length) return { mode: 'exact', it: hits[0][1] };
  const fz = fuzzy(text);
  if (fz.length && fz[0][0] >= 0.3) return { mode: 'fuzzy', it: fz[0][1] };
  if (!looksQuestion(text)) return { mode: 'ignore' };
  return { mode: 'frame', pat: classify(text) };
}

/* ---------- 渲染 ---------- */
function render(it){
  S.cur = it;
  const pts = (it.p || []).map((x, i) => `<li><span class="n">${i+1}</span>${esc(x)}</li>`).join('');
  $('main').innerHTML = `
    <div class="sec">${esc(it.sec)}</div>
    <div class="q">${esc(it.q)}${it.qc ? `<span class="ct">粤语：${esc(it.qc)}</span>` : ''}</div>
    ${it.a ? `<div class="ans"><b>一句话：</b>${esc(it.a)}</div>` : ''}
    <div class="h5">答题要点</div><ol>${pts}</ol>
    ${it.b ? `<div class="bonus"><b>加分：</b>${esc(it.b)}</div>` : ''}
    ${(it.f && it.f.length) ? `<div class="h5">可能追问</div><div class="follow">${it.f.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : ''}
  `;
  $('main').scrollTop = 0;
}
function renderPattern(p, heard){
  S.cur = null;
  const frame = (p.frame || []).map((x, i) => `<li><span class="n">${i+1}</span>${esc(x)}</li>`).join('');
  $('main').innerHTML = `
    <div class="sec" style="color:var(--warn)">题库里没有 · ${esc(p.name)}</div>
    <div class="q">按「${esc(p.name)}」的框架答<span class="ct">${esc(p.hint || '')}</span></div>
    ${heard ? `<div class="ans" style="border-left-color:var(--warn);background:linear-gradient(180deg,rgba(245,185,66,.16),rgba(245,185,66,.05));color:#f3dda8"><b>听到：</b>${esc(heard)}</div>` : ''}
    <div class="h5">照着这个结构说</div><ol>${frame}</ol>
    ${p.tips ? `<div class="bonus" style="background:rgba(245,185,66,.1);border-left-color:var(--warn);color:#f0dcae"><b>提醒：</b>${esc(p.tips)}</div>` : ''}
  `;
  $('main').scrollTop = 0;
}
function setHeard(t){
  $('foot').innerHTML = `<div class="lbl">听到</div><div class="l now">${esc(t)}</div>`;
}

/* ---------- 搜索 ---------- */
$('q').addEventListener('input', () => {
  const v = $('q').value.trim();
  if (!v){ if (S.items.length) render(S.items[0]); return; }
  const list = S.items.filter(it => {
    if (S.sec && it.sec !== S.sec) return false;
    const hay = (it.q + ' ' + it.qc + ' ' + it.a + ' ' + it.k.join(' ') + ' ' + it.p.join(' ')).toLowerCase();
    return hay.includes(v.toLowerCase());
  });
  if (list.length) render(list[0]);
  else {
    const r = route(v);
    if (r.mode === 'frame') renderPattern(r.pat, v);
    else $('main').innerHTML = `<div class="empty"><b>没有匹配</b>换个关键词，或点 🎤 说话</div>`;
  }
});

/* ---------- 语音 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR){
  $('mic').style.opacity = .4;
  $('mic').onclick = () => alert('这个浏览器不支持语音识别。\n请用 Chrome 打开，或直接用搜索框打字。');
} else {
  rec = new SR();
  rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let fin = '', interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
    }
    const show = (fin || interim).trim();
    if (show) setHeard(show);
    if (fin.trim()){
      const r = route(fin);
      if (r.mode === 'exact' || r.mode === 'fuzzy') render(r.it);
      else if (r.mode === 'frame') renderPattern(r.pat, fin);
    }
  };
  rec.onerror = e => { if (e.error === 'not-allowed') alert('没有麦克风权限，请在浏览器里允许。'); };
  rec.onend = () => { if (listening){ try{ rec.start(); }catch(_){} } };
  $('mic').onclick = () => {
    if (!listening){ try{ rec.start(); }catch(_){} listening = true; $('mic').classList.add('live'); $('dot').classList.add('on'); }
    else { listening = false; $('mic').classList.remove('live'); $('dot').classList.remove('on'); try{ rec.stop(); }catch(_){} }
  };
}

/* ---------- 分类 ---------- */
const drawer = $('drawer');
$('menu').onclick = () => { drawer.classList.add('on'); renderCats(); };
drawer.onclick = e => { if (e.target === drawer) drawer.classList.remove('on'); };
function renderCats(){
  $('cnt').textContent = S.items.length;
  const counts = {}; S.items.forEach(it => counts[it.sec] = (counts[it.sec] || 0) + 1);
  let h = `<div class="cat ${S.sec === '' ? 'on' : ''}" data-s="">全部<span class="c">${S.items.length}</span></div>`;
  S.secs.forEach(s => {
    h += `<div class="cat ${S.sec === s ? 'on' : ''}" data-s="${esc(s)}">${esc(s.replace(/^[一二三四五六七八九十]+、/, ''))}<span class="c">${counts[s] || 0}</span></div>`;
  });
  $('cats').innerHTML = h;
  document.querySelectorAll('.cat').forEach(el => {
    el.onclick = () => {
      S.sec = el.dataset.s; drawer.classList.remove('on');
      const list = S.items.filter(it => !S.sec || it.sec === S.sec);
      if (list.length) render(list[0]);
    };
  });
}

/* 自动解锁（记住密码） */
window.addEventListener('load', async () => {
  const saved = localStorage.getItem('ip_pw');
  if (saved){
    $('pw').value = saved;
    tryUnlock();
  } else {
    $('pw').focus();
  }
});
